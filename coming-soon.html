<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon - iSm@rt Coaching Classes</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .coming-soon-wrapper {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      background: #f8fafc;
    }
    .coming-soon-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 50px 30px;
      max-width: 550px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }
    .cs-icon {
      font-size: 50px;
      margin-bottom: 20px;
    }
    .coming-soon-card h1 {
      color: #0F2C59;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 12px;
    }
    .coming-soon-card p {
      color: #64748b;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 25px;
    }
    .btn-back {
      display: inline-block;
      background: #F26522;
      color: #ffffff;
      padding: 12px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      transition: all 0.3s ease;
    }
    .btn-back:hover {
      background: #0F2C59;
    }
  </style>
</head>
<body>

  <div class="coming-soon-wrapper">
    <div class="coming-soon-card">
      <div class="cs-icon">🚀</div>
      <h1>Page Under Construction</h1>
      <p>Hum is course ki detailed curriculum aur batch schedules update kar rahe hain. Naye academic session ki details bohot jald yahan available hongi!</p>
      <a href="index.html" class="btn-back">⬅ Back to Home</a>
    </div>
  </div>

</body>
</html>
